<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/bank.js" defer></script>
</head>
<body>

    <!-- HEADER OF PAGE WITH NAVIGATION -->
    <header class="header">
        <h1 class="logo">Bank Dashboard</h1>

        <nav class="nav" role="navigation" aria-label="Main Navigation">
            <a href="../index.html">Go to Home</a>
            <a href="profile.html">Go to Profile</a>
            <a href="contact.html">Go to Contact</a>
            <a href="counter.html">Go to Counter</a>
            <a href="typing.html">Go to Typing Test</a>
            <a href="click-game.html">Go to Click Game</a>
            <a href="login.html">Go to Login</a>
        </nav>
    </header>

    <!-- Main content of the page -->
    <main class="main-wrapper center-page">
        <div class="card center-card">
            <!-- Shows current balance -->
            <h2 class="balance-title">Current Balance: $<span id="balance" class="balance-text">1000</span></h2>

            <!-- Deposit -->
            <label>Deposit</label>
            <input type="number" id="depositAmount">
            <button id="depositBtn">Deposit</button>

            <!-- Withdraw -->
            <label>Withdraw</label>
            <input type="number" id="withdrawAmount">
            <button id="withdrawBtn">Withdraw</button>
        </div>
    </main>

    <!-- Footer of the page -->
    <footer class="footer">
        <p>Bank Dashboard Page</p>
    </footer>
</body>
</html>
